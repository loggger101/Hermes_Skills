# CI gate for the second brain: every push and pull request runs the full
# health check (tools/verify-all.py — every gate in its GATE_LABELS, incl. the mutation
# self-tests that prove each gate fails on planted defects, and the tooling's own unit
# tests), plus every test suite that ships inside a skill (pytest, node --test, sh/ps1
# smoke), AND a dedicated job that executes the standalone *_verify.py self-test
# harnesses against real duckdb/polars/pyarrow/numpy/pyomo installs (the base gate runs
# them too but classifies declared-missing optional deps as SKIP — this job runs them
# with --strict, so there a skip is a failure).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-all:
    name: Health gates (audit + links + index drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # audit tools compare against git history in places

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pyyaml is the audit's hard dependency; pytest runs the 'tool unit tests' gate and the
      # skill-test runner's mutation self-test; ruff (pinned exactly, so a ruff release cannot
      # change the verdict) runs the 'lint: ruff' gate. node, bash and pwsh (preinstalled on
      # ubuntu-latest) are needed by the skill-test self-test and the 'script syntax' gate:
      # a missing one FAILS the gate, it never skips.
      - name: Install tooling deps
        run: pip install "pyyaml>=6.0" pytest "ruff==0.16.9"

      # verify-all.py launches every child gate with sys.executable, so no PATH
      # games are needed; exit 1 on any failed gate fails this job.
      - name: Run all health gates
        run: python tools/verify-all.py

  skill-tests:
    name: Skill test suites (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Single source of truth for test deps (see its header comment): created
      # 2026-09-09 by running the five library-backed suites in a clean venv until green. All
      # pure wheels: fast on ubuntu, no poppler binary needed.
      - name: Install test deps
        run: pip install -r test-requirements.txt

      # Discovery-based runner: pytest suites in <skill>/tests/, node --test suites
      # (*.test.cjs/js/mjs), and sh/ps1 smoke scripts in tests/ dirs — the next skill
      # that ships any of these is in CI automatically, no YAML edit. node, bash and
      # pwsh are preinstalled on ubuntu-latest. Exit 1 on any failed suite, on a suite
      # whose every test skipped, on an orphan test file no suite runs, and on an
      # empty scan.
      - name: Run all discovered skill test suites
        run: python tools/run-skill-tests.py

  self-test-harnesses:
    name: Self-test harnesses (duckdb/polars/pyarrow live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # This is the job where the data-science harnesses actually EXECUTE instead of
      # classifying as SKIP (missing optional deps). Pins live in selftest-requirements.txt,
      # which documents why each pin exists — keep it in sync with the reference docs
      # when those versions move. polars-v2-verify.py still skips here by design: it pins
      # 2.0 rc behavior and only runs under a dedicated local venv (see its docstring).
      - name: Install harness deps
        run: pip install -r selftest-requirements.txt

      # Same runner verify-all uses as gate "self-test harnesses"; here the engines are
      # present, so big-data-patterns-verify.py runs end-to-end against pandas ground truth.
      # --strict: a SKIP from any harness marked ci_required is a FAIL here, because this
      # job installed its deps — a skip means the install broke and the harness silently
      # stopped running. (polars-v2-verify.py is not ci_required: it pins a 2.0 rc.)
      - name: Run every registered self-test harness
        run: python tools/run-self-tests.py --strict
