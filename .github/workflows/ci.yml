# CI gate for the second brain: every push and pull request runs the full
# health check (tools/verify-all.py — 14 gates, including self-tests of the
# doc-count checker, the hardcoded-secret scan, and the harness runner) plus
# the pytest suites that ship inside skills AND a dedicated job that executes
# the standalone *_verify.py self-test harnesses against real duckdb/polars/
# pyarrow/numpy installs (the base gate runs them too but classifies missing
# optional deps as SKIP — this job is what actually exercises those engines).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-all:
    name: Health gates (audit + links + index drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # audit tools compare against git history in places

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling deps (pyyaml is the hard dependency)
        run: pip install "pyyaml>=6.0"

      # verify-all.py launches every child gate with sys.executable, so no PATH
      # games are needed; exit 1 on any failed gate fails this job.
      - name: Run all health gates
        run: python tools/verify-all.py

  skill-tests:
    name: Skill test suites (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Single source of truth for test deps (see its header comment): created
      # 2026-09-09 by running all five suites in a clean venv until green. All
      # pure wheels: fast on ubuntu, no poppler binary needed.
      - name: Install test deps
        run: pip install -r test-requirements.txt

      # Discovery-based runner: finds every <skill>/tests/ dir with test files
      # (currently docx/pdf/powerpoint/xlsx/comfyui) and runs each — so the next
      # skill that ships a tests/ dir is in CI automatically, no YAML edit.
      # Exit 1 on any failed suite; an empty scan is FATAL by design.
      - name: Run all discovered skill test suites
        run: python tools/run-skill-tests.py

  self-test-harnesses:
    name: Self-test harnesses (duckdb/polars/pyarrow live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This is the job where the data-science harnesses actually EXECUTE instead of
      # classifying as SKIP (missing optional deps). Pins live in selftest-requirements.txt,
      # which documents why each pin exists — keep it in sync with the reference docs
      # when those versions move. polars-v2-verify.py still skips here by design: it pins
      # 2.0 rc behavior and only runs under a dedicated local venv (see its docstring).
      - name: Install harness deps
        run: pip install -r selftest-requirements.txt

      # Same runner verify-all uses as gate "self-test harnesses"; here the engines are
      # present, so big-data-patterns-verify.py runs end-to-end against pandas ground truth.
      # Exit 1 on any real failure; SKIP lines stay non-fatal by contract (see --list).
      - name: Run every registered self-test harness
        run: python tools/run-self-tests.py
