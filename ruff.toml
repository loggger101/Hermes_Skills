# Formatter + linter settings for this repo's own Python (tools/, .hermes/cron/, and the
# skills authored or ported here). Run from the repo root:
#
#   ruff format .     # black-compatible formatting
#   ruff check .      # pyflakes + pycodestyle errors (pinned below, see lint.select)
#
# 100 columns matches how the existing code and the markdown prose already wrap.
line-length = 100
target-version = "py38" # sync-hermes-skills.py refuses to run below 3.8

# Skills bundled with Hermes Agent (listed in profile/.bundled_manifest) are left as upstream
# ships them. Hermes compares each bundled skill against its shipped hash and stops updating
# any skill whose files changed, so a purely cosmetic reformat here would silently opt every
# untouched bundled skill out of upstream fixes once sync copies it to ~/.hermes/skills/.
# Only the bundled skills that contain Python need listing.
extend-exclude = [
    "autonomous-ai-agents/hermes-agent",
    "creative/comfyui",
    "creative/excalidraw",
    "github/github-auth",
    "github/github-code-review",
    "media/youtube-content",
    "productivity/docx",
    "productivity/google-workspace",
    "productivity/maps",
    "productivity/ocr-and-documents",
    "productivity/pdf",
    "productivity/powerpoint",
    "productivity/xlsx",
    "research/arxiv",
    "research/blocked-page-recovery",
    "research/grounded-citations",
]

[lint]
# Ruff 0.16 widened the built-in default from 59 rules to 413 (bugbear, pyupgrade, simplify, ...),
# which flags 309 findings here. Pin the old default so the gate means the same on every version.
select = ["E4", "E7", "E9", "F"]

[format]
# Ruff 0.16 also formats the Python code blocks inside Markdown by default. Every skill doc here
# quotes snippets as their authors wrote them (and verified them), so only .py files are formatted.
exclude = ["*.md"]

[lint.per-file-ignores]
# Each PATTERN section imports the engine it exercises, so it reads as the self-contained
# snippet the reference doc quotes.
"data-science/python-data-science/references/big-data-patterns-verify.py" = ["E402"]
# l and r bound the Z-box: the textbook notation, quoted verbatim in algorithms-from-scratch.md.
"data-science/algorithms-python-catalog/scripts/algorithms_verify.py" = ["E741"]
